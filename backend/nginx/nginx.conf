# nginx/nginx.conf — Development / basic production config

events {
    worker_connections 1024;
}

http {
    upstream vibequeue_api {
        server app:8000;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://vibequeue_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket upgrade
        location /api/v1/ws/ {
            proxy_pass http://vibequeue_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;  # 24h — keep WebSocket alive
            proxy_send_timeout 86400s;
        }

        # Health check (no auth needed, used by load balancer)
        location /api/v1/health/ {
            proxy_pass http://vibequeue_api;
            access_log off;
        }
    }
}
