# nginx/nginx.prod.conf — Production config with SSL (Cloudflare terminates TLS)
# When using Cloudflare as reverse proxy, Cloudflare handles HTTPS.
# Nginx only needs to accept HTTP from Cloudflare's IP ranges.

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # Logging
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"duration":$request_time}';
    access_log /var/log/nginx/access.log json_combined;

    # Gzip
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    # Rate limiting (application-level rate limiting in FastAPI/Redis is primary)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/m;

    upstream vibequeue_api {
        server app:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.vibequeue.in;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://vibequeue_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/v1/ws/ {
            proxy_pass http://vibequeue_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        location /api/v1/payments/verify {
            limit_req zone=webhooks burst=5;
            proxy_pass http://vibequeue_api;
            proxy_set_header Host $host;
        }
    }
}
