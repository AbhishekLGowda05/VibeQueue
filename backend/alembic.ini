# alembic.ini — Alembic migration configuration
# Run migrations: alembic upgrade head
# Create a new migration: alembic revision --autogenerate -m "description"
# Rollback one step: alembic downgrade -1

[alembic]
script_location = alembic
prepend_sys_path = .

# Database URL is read from app.core.config in alembic/env.py
# Do not put a real URL here — it is injected via environment variables
sqlalchemy.url = driver://user:password@localhost/dbname

[post_write_hooks]
# Auto-format migrations with ruff on creation
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
